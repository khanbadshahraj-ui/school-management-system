name: Application checks
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      matrix:
        postgres: ['16', '18']
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: school_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U school -d school_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: [6379:6379]
    env:
      APP_ENV: testing
      DB_SSLMODE: disable
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_DATABASE: school_test
      DB_USERNAME: school
      DB_PASSWORD: ci-only-password
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo_pgsql, zip, bcmath
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci && npm run build
      - run: php artisan test
      - run: composer audit
      - run: npm audit --omit=dev

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build exact deployment image
        run: docker build -t school-demo:ci .
      - name: Prepare TLS PostgreSQL and production environment
        run: |
          mkdir -p /tmp/school-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/school-tls/server.key -out /tmp/school-tls/server.crt -subj /CN=postgres
          docker network create school-ci
          docker run -d --name postgres --network school-ci -e POSTGRES_USER=school -e POSTGRES_PASSWORD=ci-only-password -e POSTGRES_DB=school_demo -v /tmp/school-tls:/tls postgres:18 bash -c 'chown postgres:postgres /tls/* && chmod 600 /tls/server.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key'
          for attempt in $(seq 1 30); do
            if docker exec postgres pg_isready -U school -d school_demo; then break; fi
            sleep 2
          done
          docker exec postgres pg_isready -U school -d school_demo
          python3 tests/container_environment.py
      - name: Boot image, verify login and database persistence across replacement
        run: |
          docker run -d --name school-app --network school-ci --env-file /tmp/school-ci.env -p 10000:10000 school-demo:ci
          python3 tests/container_smoke.py initial
          docker rm -f school-app
          docker run -d --name school-app --network school-ci --env-file /tmp/school-ci.env -p 10000:10000 school-demo:ci
          python3 tests/container_smoke.py replacement
      - name: Startup diagnostics
        if: failure()
        run: docker logs school-app

      - name: Parse Windows launcher
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/Start-Local.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
      - name: Verify local Compose login and persistent sessions and logos
        env:
          SCHOOL_DEMO_IMAGE: school-demo:ci
          SCHOOL_DEMO_PORT: '10000'
        run: |
          docker rm -f school-app
          python3 - <<'PYCI'
          import base64
          from pathlib import Path
          Path('.env.local.demo').write_text('APP_KEY=base64:'+base64.b64encode(b'c'*32).decode()+'\nLOCAL_DB_PASSWORD=ci-only-local-password\nDEMO_INITIAL_PASSWORD=CI-only-owner-password\n')
          PYCI
          docker compose -p school-local-ci --env-file .env.local.demo -f compose.local.yaml up -d --no-build --wait --wait-timeout 180
          python3 tests/container_smoke.py initial
          docker compose -p school-local-ci --env-file .env.local.demo -f compose.local.yaml up -d --no-build --force-recreate --no-deps --wait --wait-timeout 180 app
          python3 tests/container_smoke.py replacement
      - name: Local diagnostics
        if: failure()
        run: docker compose -p school-local-ci --env-file .env.local.demo -f compose.local.yaml logs --tail=60
