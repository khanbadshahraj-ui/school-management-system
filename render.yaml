services:
  - type: web
    name: school-management-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: DEPLOYMENT_PROFILE
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_ENCRYPT
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: array
      - key: FILESYSTEM_DISK
        value: local
      - key: LOG_CHANNEL
        value: stderr
      - key: BULK_UPLOADS_ENABLED
        value: "false"
      - key: EXTERNAL_MESSAGES_ENABLED
        value: "false"
      - key: LIVE_PAYMENTS_ENABLED
        value: "false"
      - key: DEMO_BOOTSTRAP_ENABLED
        value: "false"
