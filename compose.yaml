services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Set LOCAL_DB_PASSWORD in your local environment}
      POSTGRES_DB: school
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["school_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]
volumes:
  school_pg:
